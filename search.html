<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Properties | UniNest</title>
  <meta name="description" content="Search for student properties. Filter by type, location, and price to find your perfect match.">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-search">
  <!-- Navbar -->
  <nav class="navbar scrolled">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <img src="images/logo.jpg" alt="UniNest Logo" style="height: 2rem; width: auto;" />
        UniNest
      </a>
      <button class="mobile-menu-btn" aria-label="Toggle menu" onclick="this.parentElement.classList.toggle('mobile-menu-open')">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="search.html" class="active">Properties</a>
        <a href="agents.html">Agents</a>
        <a href="marketplace.html">Marketplace</a>
      </div>
      <div class="nav-actions">
        <!-- Injected dynamically by auth.js -->
        <a href="marketplace.html#sell" class="btn btn-secondary" style="margin-right: 0.35rem; font-size: 0.85rem; padding: 0.45rem 0.85rem;">+ Sell Item</a>
        <a href="agents.html" class="btn btn-secondary" style="margin-right: 0.35rem; font-size: 0.85rem; padding: 0.45rem 0.85rem;">List Property</a>
        <a href="marketplace.html?portal=agent" class="btn btn-primary" style="font-size: 0.85rem; padding: 0.45rem 0.85rem;">Agent Portal</a>
      </div>
    </div>
  </nav>

  <div class="container search-page-layout">
    <!-- Sidebar Filters -->
    <aside class="filter-sidebar animate-fade-in-up">
      <h3 style="margin-bottom: 1.5rem; font-size: 1.25rem;">Filters</h3>
      
      <div class="filter-group">
        <h4>Property Type</h4>
        <select id="filter-type" style="width: 100%; padding: 0.75rem; border: 1px solid var(--color-gray-light); border-radius: var(--border-radius-sm);">
          <option value="Any">All Types</option>
          <option value="Bedsitter">Bedsitter</option>
          <option value="1-Bedroom">1-Bedroom</option>
          <option value="2-Bedroom">2-Bedroom</option>
        </select>
      </div>

      <div class="filter-group">
        <h4>Distance to Campus</h4>
        <label><input type="radio" name="distance" checked> Any distance</label>
        <label><input type="radio" name="distance"> Under 1 km</label>
        <label><input type="radio" name="distance"> Under 3 km</label>
      </div>
      
      <div class="filter-group">
        <h4>Amenities</h4>
        <label><input type="checkbox"> Wi-Fi included</label>
        <label><input type="checkbox"> Security</label>
        <label><input type="checkbox"> Furnished</label>
      </div>
      
      <button type="button" id="apply-filters-btn" class="btn btn-primary" style="width: 100%;">Apply Filters</button>
    </aside>

    <!-- Results Area -->
    <main>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h1 style="font-size: 1.75rem; font-weight: 500;">Available Properties</h1>
        <div style="color: var(--color-gray);">Sort by: <strong>Newest</strong></div>
      </div>
      
      <div class="properties-grid" id="search-results">
        <!-- Rendered via JS, starting with skeletons -->
      </div>
    </main>
  </div>

  <!-- Footer -->
  <footer class="footer" style="margin-top: 5rem;">
    <div class="container">
      <div class="footer-bottom">
        <div class="footer-bottom-left">
          &copy; 2026 UniNest&trade;
        </div>
        <div class="footer-bottom-center">
          <a href="#" class="footer-legal-link">Terms of Service</a>
          <a href="#" class="footer-legal-link">Privacy Policy</a>
        </div>
        <div class="footer-bottom-right footer-social-icons">
          <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="footer-social-icon facebook" aria-label="Facebook">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
          </a>
          <a href="https://www.instagram.com/uninest" target="_blank" rel="noopener noreferrer" class="footer-social-icon instagram" aria-label="Instagram">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="20" height="20" x="2" y="2" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"></line>
            </svg>
          </a>
          <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" class="footer-social-icon twitter" aria-label="Twitter">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/>
            </svg>
          </a>
          <a href="https://www.tiktok.com/@uninest" target="_blank" rel="noopener noreferrer" class="footer-social-icon tiktok" aria-label="TikTok">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.89 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1v-3.52a6.37 6.37 0 0 0-.79-.05A6.34 6.34 0 0 0 3 15.67 6.34 6.34 0 0 0 9.34 22a6.34 6.34 0 0 0 6.34-6.33V9.05c1.26.86 2.76 1.36 4.38 1.41V7.02c-.16 0-.32-.01-.47-.03v-.3z"/>
            </svg>
          </a>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/data.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
